<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 312" width="470" height="312" role="img" aria-label="Hello There! I'm Giovana Lopes, a third-semester Systems Analysis and Development student. This little corner of GitHub is where I keep my projects and programming studies, and where I share what I learn along the way. Always curious, always building, always growing as a developer." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
