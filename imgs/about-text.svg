<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 248" width="800" height="248" role="img" aria-label="Hello There! I'm Giovana Lopes, a third-semester Systems Analysis and Development student. This little corner of GitHub is where I keep my projects and programming studies, and where I share what I learn along the way." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1520"/>
      <stop offset="1" stop-color="#110e16"/>
    </linearGradient>
  </defs>

  <!-- Cartão estilo editor de código -->
  <rect x="1" y="1" width="798" height="246" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="246" rx="12" fill="none" stroke="#ecdfab" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Barra de título -->
  <path d="M1 13 a12 12 0 0 1 12 -12 H787 a12 12 0 0 1 12 12 V40 H1 Z" fill="#ecdfab" fill-opacity="0.06"/>
  <line x1="1" y1="40" x2="799" y2="40" stroke="#ecdfab" stroke-opacity="0.15"/>
  <circle cx="26" cy="21" r="5.5" fill="#ec5c73"/>
  <circle cx="46" cy="21" r="5.5" fill="#ecdfab"/>
  <circle cx="66" cy="21" r="5.5" fill="#8b949e" fill-opacity="0.6"/>
  <text x="92" y="26" font-family="'Fira Code','Courier New',Courier,monospace" font-size="13" fill="#8b949e">about_me.md</text>

  <!-- Barra rosa lateral que pulsa -->
  <rect x="1" y="41" width="4" height="194" fill="#ec5c73">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Linha 1 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.30s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" dur="0.5s" begin="0.30s" fill="freeze"/>
    <text x="44" y="86" textLength="504" lengthAdjust="spacing" xml:space="preserve" font-family="'Fira Code','Courier New',Courier,monospace" font-size="15"><tspan fill="#ec5c73" font-weight="700">Hello There!</tspan><tspan fill="#e6e1d0"> I'm </tspan><tspan fill="#ecdfab" font-weight="700">Giovana Lopes</tspan><tspan fill="#e6e1d0">, a third-semester </tspan><tspan fill="#ecdfab">Systems</tspan></text>
  </g>
  <!-- Linha 2 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.85s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" dur="0.5s" begin="0.85s" fill="freeze"/>
    <text x="44" y="118" textLength="495" lengthAdjust="spacing" xml:space="preserve" font-family="'Fira Code','Courier New',Courier,monospace" font-size="15"><tspan fill="#ecdfab">Analysis and Development</tspan><tspan fill="#e6e1d0"> student. This little corner of</tspan></text>
  </g>
  <!-- Linha 3 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.40s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" dur="0.5s" begin="1.40s" fill="freeze"/>
    <text x="44" y="150" textLength="531" lengthAdjust="spacing" xml:space="preserve" font-family="'Fira Code','Courier New',Courier,monospace" font-size="15"><tspan fill="#e6e1d0">GitHub</tspan><tspan fill="#e6e1d0"> is where I keep my </tspan><tspan fill="#ec5c73" font-weight="700">projects</tspan><tspan fill="#e6e1d0"> and </tspan><tspan fill="#ec5c73" font-weight="700">programming studies</tspan><tspan fill="#e6e1d0">,</tspan></text>
  </g>
  <!-- Linha 4 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.95s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" dur="0.5s" begin="1.95s" fill="freeze"/>
    <text x="44" y="182" textLength="405" lengthAdjust="spacing" xml:space="preserve" font-family="'Fira Code','Courier New',Courier,monospace" font-size="15"><tspan fill="#e6e1d0">and where I share what I learn along the way.</tspan></text>
  </g>
  <!-- Linha 5 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.50s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" dur="0.5s" begin="2.50s" fill="freeze"/>
    <text x="44" y="214" textLength="567" lengthAdjust="spacing" xml:space="preserve" font-family="'Fira Code','Courier New',Courier,monospace" font-size="15"><tspan fill="#e6e1d0">Always </tspan><tspan fill="#ec5c73" font-weight="700">curious</tspan><tspan fill="#e6e1d0">, always </tspan><tspan fill="#ec5c73" font-weight="700">building</tspan><tspan fill="#e6e1d0">, always </tspan><tspan fill="#ec5c73" font-weight="700">growing</tspan><tspan fill="#e6e1d0"> as a developer.</tspan></text>
  </g>
  <!-- Cursor piscando no fim do texto -->
  <rect x="615" y="199" width="8" height="19" fill="#ec5c73" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="1;0" dur="1s" begin="3.10s" repeatCount="indefinite"/>
  </rect>
</svg>
