<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 90" width="600" height="90" role="img" aria-label="Thanks for stopping by" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Linhas de circuito (desenham da borda para o centro) -->
  <path d="M20 36 H200 L216 20 H252" pathLength="1" fill="none" stroke="#ec5c73" stroke-width="2" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.2s" dur="1.2s" fill="freeze"/>
  </path>
  <path d="M580 36 H400 L384 20 H348" pathLength="1" fill="none" stroke="#ec5c73" stroke-width="2" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.2s" dur="1.2s" fill="freeze"/>
  </path>

  <!-- Detalhes bege nas pontas -->
  <rect x="20" y="34" width="26" height="4" fill="#ecdfab" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
  </rect>
  <rect x="554" y="34" width="26" height="4" fill="#ecdfab" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
  </rect>
  <circle cx="252" cy="20" r="3" fill="#ecdfab" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/>
  </circle>
  <circle cx="348" cy="20" r="3" fill="#ecdfab" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/>
  </circle>

  <!-- Pontinhos de energia correndo pelas linhas -->
  <circle r="2.5" fill="#ecdfab" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    <animateMotion dur="3s" begin="1.6s" repeatCount="indefinite" path="M20 36 H200 L216 20 H252"/>
  </circle>
  <circle r="2.5" fill="#ecdfab" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    <animateMotion dur="3s" begin="1.6s" repeatCount="indefinite" path="M580 36 H400 L384 20 H348"/>
  </circle>

  <!-- Centro: < ◆ > -->
  <path d="M282 12 L274 20 L282 28" fill="none" stroke="#ec5c73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M318 12 L326 20 L318 28" fill="none" stroke="#ec5c73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(300 20)">
    <rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="none" stroke="#ec5c73" stroke-width="2"/>
    <rect x="-3.5" y="-3.5" width="7" height="7" transform="rotate(45)" fill="#ec5c73">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Frase -->
  <text x="194" y="68" textLength="190" lengthAdjust="spacing" font-family="'Fira Code','Courier New',Courier,monospace"
        font-size="13" fill="#8b949e" opacity="0">
    // thanks for stopping by
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.8s" fill="freeze"/>
  </text>

  <!-- Coração batendo -->
  <g transform="translate(402 64)">
    <path d="M0 -3 C-1 -6 -6 -6 -6 -2 C-6 2 0 6 0 8 C0 6 6 2 6 -2 C6 -6 1 -6 0 -3 Z" fill="#ec5c73">
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1;1.2;1" keyTimes="0;0.15;0.3;0.45;1" dur="1.6s" begin="1.8s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
</svg>
