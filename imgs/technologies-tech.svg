<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536 90" width="536" height="90" role="img" aria-label="Technologies" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Efeito de digitação: revela o texto letra por letra -->
    <clipPath id="typing">
      <rect x="76" y="0" width="0" height="90">
        <animate attributeName="width" calcMode="discrete" begin="0.4s" dur="2.55s" fill="freeze" values="0;24;48;72;96;120;144;168;192;216;240;264;288;312;336;360;384"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Comentário de código no topo -->
  <text x="268" y="22" text-anchor="middle" font-family="'Fira Code','Courier New',Courier,monospace"
        font-size="13" fill="#8b949e" opacity="0">
    // my stack
    <animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.6s" fill="freeze"/>
  </text>

  <!-- Chaves decorativas { } que pulsam -->
  <text x="40" y="64" text-anchor="middle" font-family="'Fira Code','Courier New',Courier,monospace"
        font-size="44" fill="#ec5c73" opacity="0">
    {
    <animate attributeName="opacity" values="0;1;0.45;1" keyTimes="0;0.2;0.6;1" dur="2.6s" begin="2.55s" repeatCount="indefinite"/>
  </text>
  <text x="496" y="64" text-anchor="middle" font-family="'Fira Code','Courier New',Courier,monospace"
        font-size="44" fill="#ec5c73" opacity="0">
    }
    <animate attributeName="opacity" values="0;1;0.45;1" keyTimes="0;0.2;0.6;1" dur="2.6s" begin="2.55s" repeatCount="indefinite"/>
  </text>

  <!-- Brilho + texto principal -->
  <g clip-path="url(#typing)">
    <text x="76" y="62" textLength="384" lengthAdjust="spacing" xml:space="preserve"
          font-family="'Fira Code','Courier New',Courier,monospace" font-size="40" font-weight="700"
          filter="url(#glow)" opacity="0.5"><tspan fill="#ec5c73">&lt;</tspan><tspan fill="#ecdfab">Technologies</tspan><tspan fill="#ec5c73"> /&gt;</tspan></text>
    <text x="76" y="62" textLength="384" lengthAdjust="spacing" xml:space="preserve"
          font-family="'Fira Code','Courier New',Courier,monospace" font-size="40" font-weight="700"><tspan fill="#ec5c73">&lt;</tspan><tspan fill="#ecdfab">Technologies</tspan><tspan fill="#ec5c73"> /&gt;</tspan></text>
  </g>

  <!-- Cursor piscando que acompanha a digitação -->
  <rect x="76" y="28" width="4" height="44" fill="#ec5c73">
    <animate attributeName="x" calcMode="discrete" begin="0.4s" dur="2.55s" fill="freeze" values="76;100;124;148;172;196;220;244;268;292;316;340;364;388;412;436;460"/>
    <animate attributeName="opacity" calcMode="discrete" values="1;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Barra de "carregamento" sob o texto -->
  <path d="M76 80 H460" fill="none" stroke="#ecdfab" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <path d="M76 80 H460" pathLength="1" fill="none" stroke="#ec5c73" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="0.18 0.82">
    <animate attributeName="stroke-dashoffset" from="0" to="-1" dur="2.4s" repeatCount="indefinite"/>
  </path>
</svg>
